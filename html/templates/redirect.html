<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Octopus AI Assistant</title>
    <link rel="stylesheet" href="theme.css">
</head>

<body>
<div class="app app--narrow">
    <header class="app-header">
        <span class="brand-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
                <defs>
                    <linearGradient id="sparkle" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#9ecbff"/>
                        <stop offset="1" stop-color="#c4a6ff"/>
                    </linearGradient>
                </defs>
                <path d="M14 2.5 Q15 9.5 22 11 Q15 12.5 14 19.5 Q13 12.5 6 11 Q13 9.5 14 2.5 Z" fill="url(#sparkle)"/>
                <path d="M5.5 14 Q6 17 9 17.75 Q6 18.5 5.5 21.5 Q5 18.5 2 17.75 Q5 17 5.5 14 Z" fill="url(#sparkle)"/>
            </svg>
        </span>
        <h1 class="brand-title">Octopus AI Assistant</h1>
    </header>

    <div class="section panel">
        <div id="octopus_success" class="alert alert-success" role="alert">
            {{ message }}
        </div>
        <div class="spinner" role="status">
            <span class="sr-only">Redirecting...</span>
        </div>
    </div>
</div>
</body>
<script>
    window.location.href = {{ redirect_url | tojson}};
</script>

</html>
